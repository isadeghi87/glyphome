bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">bioviz reference</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    edit: https://github.com/isadeghi87/bioviz/edit/main/book/%s
    download: ["pdf", "epub"]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: true
bookdown::epub_book: default
